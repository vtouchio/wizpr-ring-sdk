name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        # Runners sometimes cannot resolve the Ubuntu mirror for a few minutes; retry instead of failing the job.
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y libdbus-1-dev pkg-config; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::apt failed (attempt $attempt of 3), retrying in 60s"
              sleep 60
            fi
          done
          echo "::error::apt failed after 3 attempts"
          exit 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build all targets
        run: cargo build --workspace --all-targets

      - name: Test workspace
        run: cargo test --workspace --all-targets

      - name: Check desktop CLI
        run: cargo run --bin wizpr-ring-desktop -- --help

      - name: Build desktop release binary
        run: cargo build --release --bin wizpr-ring-desktop

      - name: Package desktop binary
        shell: bash
        run: |
          mkdir -p dist
          arch="$(echo "${{ runner.arch }}" | tr '[:upper:]' '[:lower:]')"
          case "${{ runner.os }}" in
            Linux)
              cp target/release/wizpr-ring-desktop "dist/wizpr-ring-desktop-linux-${arch}"
              chmod +x "dist/wizpr-ring-desktop-linux-${arch}"
              ;;
            macOS)
              cp target/release/wizpr-ring-desktop "dist/wizpr-ring-desktop-macos-${arch}"
              chmod +x "dist/wizpr-ring-desktop-macos-${arch}"
              ;;
            Windows)
              cp target/release/wizpr-ring-desktop.exe "dist/wizpr-ring-desktop-windows-${arch}.exe"
              ;;
          esac

      - name: Upload desktop binary
        uses: actions/upload-artifact@v6
        with:
          name: wizpr-ring-desktop-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
